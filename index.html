<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport"
        content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#0f6b5c">
    <link rel="manifest" href="manifest.json">
    <title>Ledger</title>
    <style>
        :root {
            --bg: #f2f4ef;
            --card: #fff;
            --ink: #1c2822;
            --mute: #6a766f;
            --line: #d9ded6;
            --acc: #0f6b5c;
            --neg: #b03a26;
            color-scheme: light
        }

        @media(prefers-color-scheme:dark) {
            :root:not([data-t=l]) {
                --bg: #121a16;
                --card: #1b2620;
                --ink: #e6ece7;
                --mute: #93a198;
                --line: #2b3932;
                --acc: #4fc3a8;
                --neg: #ee8b74;
                color-scheme: dark
            }
        }

        * {
            box-sizing: border-box
        }

        html,
        body {
            margin: 0
        }

        body {
            background: var(--bg);
            color: var(--ink);
            font: 16px/1.4 system-ui, sans-serif;
            padding: env(safe-area-inset-top) 0 calc(64px + env(safe-area-inset-bottom))
        }

        main {
            max-width: 560px;
            margin: 0 auto;
            padding: 16px
        }

        h2 {
            font: 600 22px Georgia, serif;
            margin: 4px 0 14px
        }

        label {
            display: block;
            font-size: 13px;
            color: var(--mute);
            margin: 12px 0 4px
        }

        input,
        select,
        button {
            font: inherit;
            width: 100%;
            padding: 11px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--card);
            color: var(--ink)
        }

        button {
            background: var(--acc);
            color: var(--bg);
            border: 0;
            font-weight: 600;
            margin-top: 14px
        }

        button.s {
            background: none;
            color: var(--ink);
            border: 1px solid var(--line)
        }

        .row {
            display: flex;
            gap: 10px
        }

        .row>* {
            flex: 1
        }

        nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            background: var(--card);
            border-top: 1px solid var(--line);
            padding-bottom: env(safe-area-inset-bottom)
        }

        nav a {
            flex: 1;
            text-align: center;
            padding: 14px 0;
            color: var(--mute);
            font-weight: 600;
            font-size: 14px
        }

        nav a.on {
            color: var(--acc);
            box-shadow: inset 0 3px var(--acc)
        }

        .li {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            padding: 11px 0;
            border-bottom: 1px solid var(--line)
        }

        .li small {
            display: block;
            color: var(--mute)
        }

        .amt {
            font-family: Georgia, serif;
            white-space: nowrap
        }

        .n {
            color: var(--neg)
        }

        .bar {
            display: grid;
            grid-template-columns: 110px 1fr 70px;
            gap: 8px;
            align-items: center;
            font-size: 13px;
            margin: 7px 0
        }

        .bar i {
            display: block;
            height: 14px;
            background: var(--acc);
            border-radius: 2px
        }

        .bar span:first-child {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }

        .mute {
            color: var(--mute);
            font-size: 14px
        }

        .sec {
            display: none
        }

        .sec.on {
            display: block
        }
    </style>
</head>

<body>
    <main>
        <section id="add" class="sec on">
            <h2>New transaction</h2>
            <div class="row">
                <div><label>Date</label><input type="date" id="d"></div>
                <div><label>Type</label><select id="ty"></select></div>
            </div>
            <label>Amount</label><input id="am" type="number" step="0.01"
                inputmode="decimal" placeholder="0.00">
            <label>Transaction name</label><input
                id="nm"><label>Company/shop</label><input id="sh">
            <label>Account</label><select id="ac"></select>
            <div id="pw" style="display:none"><label>Share price</label><input
                    id="pr" type="number" step="0.0001" inputmode="decimal">
            </div>
            <label>Parent category</label><select
                id="pc"></select><label>Spending category</label><select
                id="ct"></select>
            <label>Affected budget (optional)</label><input id="bd">
            <button id="sv">Save transaction</button>
            <p class="mute" id="msg"></p>
        </section>

        <section id="acc" class="sec">
            <h2>Accounts</h2>
            <div id="al"></div>
        </section>

        <section id="ch" class="sec">
            <h2>Spending</h2><label>Month</label><input type="month" id="mo">
            <div id="c1"></div>
            <h2 style="margin-top:26px">Last 6 months</h2>
            <div id="c2"></div>
        </section>

        <section id="dt" class="sec">
            <h2>Sync</h2>
            <p class="mute" id="st"></p>
            <button id="ex">Export new transactions</button><button class="s"
                id="exa">Export all phone transactions</button>
            <label>Import accounts / categories / history (CSV from
                Excel)</label><input type="file" id="im" accept=".csv" multiple>
            <h2 style="margin-top:26px">Recent</h2>
            <div id="rl"></div>
            <button class="s" id="clr">Erase everything on this phone</button>
        </section>
    </main>
    <nav><a href="#add" class="on">Add</a><a href="#acc">Accounts</a><a
            href="#ch">Charts</a><a href="#dt">Sync</a></nav>
    <script>
        // Edit to match your Transaction Type values: [label, sign applied to Net Impact]
        const TYPES = [['⭕️ Expense', -1], ['✅ Income', 1]];
        const K = 'ledger1'; let S = { accounts: [], cats: [], txns: [], asOf: 0 };
        try { S = Object.assign(S, JSON.parse(localStorage.getItem(K) || '{}')) } catch (e) { }
        const save = () => { try { localStorage.setItem(K, JSON.stringify(S)) } catch (e) { alert('Could not save: browser storage is blocked or full.') } };
        const $ = i => document.getElementById(i), money = n => (n < 0 ? '-' : '') + '$' + Math.abs(n).toLocaleString('en-AU', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        const num = s => { s = String(s ?? '').replace(/[$,\s]/g, ''); if (/^\(.*\)$/.test(s)) s = '-' + s.slice(1, -1); const n = parseFloat(s); return isNaN(n) ? null : n };
        const iso = s => { const m = s.match(/^(\d+)\/(\d+)\/(\d{4})/); return m ? `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}` : s.slice(0, 10) };
        function csv(t) {
            const r = []; let row = [], f = '', q = 0; t = t.replace(/^\uFEFF/, ''); for (let i = 0; i < t.length; i++) { const c = t[i]; if (q) { if (c == '"') { if (t[i + 1] == '"') { f += '"'; i++ } else q = 0 } else f += c } else if (c == '"') q = 1; else if (c == ',') { row.push(f); f = '' } else if (c == '\n' || c == '\r') { if (c == '\r' && t[i + 1] == '\n') i++; row.push(f); r.push(row); row = []; f = '' } else f += c }
            if (f || row.length) { row.push(f); r.push(row) } const h = (r.shift() || []).map(x => x.trim()); return r.filter(x => x.some(y => y.trim())).map(x => Object.fromEntries(h.map((k, i) => [k, (x[i] || '').trim()])))
        }
        const esc = v => { v = String(v ?? ''); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v };
        const opt = (el, a, v) => { el.innerHTML = a.map(x => `<option>${x}</option>`).join(''); if (v && a.includes(v)) el.value = v };
        const acct = n => S.accounts.find(a => a.name == n);

        function fillForm() {
            opt($('ty'), TYPES.map(t => t[0]));
            opt($('ac'), S.accounts.map(a => a.name), $('ac').value);
            opt($('pc'), [...new Set(S.cats.map(c => c.p))], $('pc').value); fillCat(); acChg()
        }
        function fillCat() { opt($('ct'), S.cats.filter(c => c.p == $('pc').value).map(c => c.c), $('ct').value) }
        function acChg() { const a = acct($('ac').value), sh = a && a.type == 'Shares'; $('pw').style.display = sh ? 'block' : 'none'; if (sh && a.price && !$('pr').value) $('pr').value = a.price }
        $('pc').onchange = fillCat; $('ac').onchange = () => { $('pr').value = ''; acChg() };

        $('sv').onclick = () => {
            const amt = num($('am').value), a = acct($('ac').value);
            if (!amt || !$('d').value || !a) return $('msg').textContent = 'Enter a date, amount and account (import accounts on the Sync tab first).';
            const sign = TYPES.find(t => t[0] == $('ty').value)[1], sh = a.type == 'Shares';
            S.txns.push({
                id: 'P' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), ts: Date.now(), sent: 0,
                date: $('d').value, type: $('ty').value, name: $('nm').value.trim(), shop: $('sh').value.trim(), acct: a.name, net: sign * Math.abs(amt),
                parent: $('pc').value, price: sh ? num($('pr').value) : null, cat: $('ct').value, amt: Math.abs(amt), budget: $('bd').value.trim()
            });
            save();['am', 'nm', 'sh', 'bd'].forEach(i => $(i).value = ''); $('msg').textContent = 'Saved. Export it from the Sync tab when ready.'; render()
        };

        const phone = () => S.txns.filter(t => !t.hist);
        function render() {
            $('d').value = $('d').value || new Date().toLocaleDateString('en-CA');
            $('mo').value = $('mo').value || $('d').value.slice(0, 7);
            // accounts
            const delta = {}; phone().filter(t => t.ts > S.asOf).forEach(t => delta[t.acct] = (delta[t.acct] || 0) + t.net);
            $('al').innerHTML = S.accounts.length ? S.accounts.map(a => {
                const sh = a.type == 'Shares', v = (a.amt || 0) + (sh ? 0 : delta[a.name] || 0);
                return `<div class="li"><div>${a.name}<small>${a.type}${sh && delta[a.name] ? ' · new activity not included' : ''}</small></div><div class="amt ${v < 0 ? 'n' : ''}">${money(v)}</div></div>`
            }).join('')
                + '<p class="mute">Balances are the last Excel snapshot plus transactions added on this phone since.</p>' : '<p class="mute">No accounts yet. Save your Accounts table as CSV and import it on the Sync tab.</p>';
            // charts
            const sp = S.txns.filter(t => t.net < 0), m = $('mo').value, g = {};
            sp.filter(t => t.date.startsWith(m)).forEach(t => g[t.parent || 'Uncategorised'] = (g[t.parent || 'Uncategorised'] || 0) - t.net);
            const e = Object.entries(g).sort((a, b) => b[1] - a[1]), mx = e.length ? e[0][1] : 1;
            $('c1').innerHTML = e.length ? e.map(([k, v]) => `<div class="bar"><span>${k}</span><span><i style="width:${v / mx * 100}%"></i></span><span class="amt">${money(v)}</span></div>`).join('') : '<p class="mute">No spending recorded for this month.</p>';
            const ms = []; let d = new Date(m + '-01'); for (let i = 0; i < 6; i++) { ms.unshift(d.toLocaleDateString('en-CA').slice(0, 7)); d = new Date(d.getFullYear(), d.getMonth() - 1, 1) }
            const tot = ms.map(x => sp.filter(t => t.date.startsWith(x)).reduce((s, t) => s - t.net, 0)), tm = Math.max(...tot, 1);
            $('c2').innerHTML = ms.map((x, i) => `<div class="bar"><span>${x}</span><span><i style="width:${tot[i] / tm * 100}%"></i></span><span class="amt">${money(tot[i])}</span></div>`).join('');
            // sync
            const p = phone(), u = p.filter(t => !t.sent).length;
            $('st').textContent = `${u} not yet exported · ${p.length} entered on this phone · ${S.txns.length - p.length} history rows · ${S.accounts.length} accounts`;
            $('rl').innerHTML = p.slice(-10).reverse().map(t => `<div class="li"><div>${t.name || t.cat}<small>${t.date} · ${t.acct}${t.sent ? '' : ' · not exported'}</small></div><div class="amt ${t.net < 0 ? 'n' : ''}">${money(t.net)}</div></div>`).join('') || '<p class="mute">Nothing yet.</p>'
        }
        $('mo').onchange = render;

        const COLS = ['Transaction Date', 'Transaction Type', 'Transaction Name', 'Company/Shop', 'Linked Account', 'Net Impact', 'Parent Category', 'Share Price', 'Spending Category', 'Transaction Amount', 'Affected Budget', 'Phone ID'];
        function exp(all) {
            const r = phone().filter(t => all || !t.sent); if (!r.length) return alert('Nothing to export.');
            const rows = r.map(t => [t.date, t.type, t.name, t.shop, t.acct, t.net.toFixed(2), t.parent, t.price ?? '', t.cat, t.amt.toFixed(2), t.budget, t.id]);
            const b = new Blob(['\uFEFF' + [COLS, ...rows].map(x => x.map(esc).join(',')).join('\r\n')], { type: 'text/csv' }), a = document.createElement('a');
            const n = new Date(), z = x => String(x).padStart(2, '0');
            a.href = URL.createObjectURL(b); a.download = `phone_txns_${n.getFullYear()}${z(n.getMonth() + 1)}${z(n.getDate())}_${z(n.getHours())}${z(n.getMinutes())}${z(n.getSeconds())}.csv`; a.click();
            r.forEach(t => t.sent = 1); save(); render()
        }
        $('ex').onclick = () => exp(0); $('exa').onclick = () => exp(1);

        $('im').onchange = async e => {
            let log = [];
            for (const f of e.target.files) {
                const r = csv(await f.text()), h = r[0] || {};
                if ('Account Name' in h) { S.accounts = r.filter(x => x['Account Name']).map(x => ({ type: x.Type, name: x['Account Name'], amt: num(x['Current Amount']), price: num(x['Latest Share Price']) })); S.asOf = Date.now(); log.push('accounts') }
                else if ('Category Name' in h) { S.cats = r.filter(x => x['Category Name']).map(x => ({ p: x['Parent Category Name'], c: x['Category Name'] })); log.push('categories') }
                else if ('Transaction Date' in h) {
                    S.txns = S.txns.filter(t => !t.hist);
                    S.txns.unshift(...r.map((x, i) => ({ hist: 1, id: 'H' + i, date: iso(x['Transaction Date']), net: num(x['Net Impact']) || 0, parent: x['Parent Category'], cat: x['Spending Category'], acct: x['Linked Account'] }))); log.push('history')
                }
                else log.push('skipped ' + f.name)
            }
            save(); fillForm(); render(); alert('Imported: ' + log.join(', ')); e.target.value = ''
        };
        $('clr').onclick = () => { if (confirm('Delete all data on this phone? Unexported transactions will be lost.')) { S = { accounts: [], cats: [], txns: [], asOf: 0 }; save(); fillForm(); render() } };

        const tabs = [...document.querySelectorAll('nav a')];
        function nav() { const h = (location.hash || '#add').slice(1); document.querySelectorAll('.sec').forEach(s => s.classList.toggle('on', s.id == h)); tabs.forEach(a => a.classList.toggle('on', a.hash == '#' + h)); window.scrollTo(0, 0) }
        addEventListener('hashchange', nav);
        fillForm(); render(); nav();
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => { });
    </script>
</body>

</html>
